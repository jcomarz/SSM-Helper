<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSM Bonus Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16131F; --ink-2:#1F1B2C; --ink-3:#2A2438;
  --line:#372F49; --text:#EDE9F5; --dim:#9A90B4;
  --anniv:#E8B84B; --birth:#FF6BAA; --today:#7BE0D6; --fav:#FFD166;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);
  font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 72px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
h1{font-size:23px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px}
.legend{display:flex;gap:14px;margin:12px 0 16px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.key{display:inline-flex;align-items:center;gap:7px}
.swatch{width:22px;height:9px;border-radius:99px;display:inline-block}
.sw-a{background:var(--anniv)}.sw-b{background:var(--birth)}
button{font:inherit;color:inherit;background:var(--ink-2);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 13px;cursor:pointer;transition:background .13s,border-color .13s}
button:hover{background:var(--ink-3)}
button:focus-visible{outline:2px solid var(--today);outline-offset:2px}
button.on{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.spacer{flex:1}
.range{font-size:13px;color:var(--dim);padding:0 2px}
.modes{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:0 0 16px;padding-bottom:12px}
select,input[type=number],input[type=search]{font:inherit;color:var(--text);
  background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
input[type=number]{width:82px}

/* filter */
.filter{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);
  margin-bottom:16px;overflow:hidden}
.filter summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;
  list-style:none;display:flex;align-items:center;gap:10px}
.filter summary::-webkit-details-marker{display:none}
.filter summary::before{content:"\25B8";color:var(--dim);transition:transform .15s;display:inline-block}
.filter[open] summary::before{transform:rotate(90deg)}
.count{color:var(--dim);font-weight:400}
.fbody{padding:0 14px 14px;border-top:1px solid var(--line)}
#search{width:100%;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:250px;overflow:auto}
.chip{display:inline-flex;align-items:stretch;border:1px solid var(--line);
  border-radius:99px;overflow:hidden}
.chip .star{background:transparent;border:none;border-radius:0;padding:6px 6px 6px 10px;
  color:#4B4260;font-size:13px;line-height:1}
.chip .star.on{color:var(--fav)}
.chip .nm{background:transparent;border:none;border-radius:0;padding:6px 12px 6px 4px;
  font-size:12.5px;color:var(--dim)}
.chip.sel .nm{color:var(--text)}
.chip.sel{background:var(--ink-3);border-color:var(--dim)}

/* week lanes */
.lanes{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ink-2)}
.lane-head,.lane{display:grid;grid-template-columns:minmax(96px,1.35fr) repeat(7,1fr)}
.lane-head{border-bottom:1px solid var(--line)}
.dh{padding:0;border-left:1px solid var(--line)}
.dh button{width:100%;background:transparent;border:none;border-radius:0;padding:9px 2px;
  text-align:center;font-size:11px;color:var(--dim);font-family:"JetBrains Mono",monospace}
.dh button b{display:block;font-size:14px;color:var(--text);font-weight:700}
.dh.today button,.dh.today button b{color:var(--today)}
.lane{border-top:1px solid var(--line);min-height:38px;align-items:center}
.lname{padding:8px 10px;font-size:12.5px;font-weight:500;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.lname .fs{color:var(--fav);font-size:11px}
.cell{height:100%;border-left:1px solid var(--line);position:relative;display:flex;
  align-items:center;padding:6px 0}
.cell.today{background:rgba(123,224,214,.05)}
.hold{position:absolute;left:0;right:0;height:11px}
.hold.start{left:4px;border-radius:99px 0 0 99px}
.hold.end{right:4px;border-radius:0 99px 99px 0}
.hold.start.end{border-radius:99px}
.hold.a{background:var(--anniv);top:8px}
.hold.b{background:var(--birth);bottom:8px}
.lane.dual .hold.a{top:5px}.lane.dual .hold.b{bottom:5px}
.empty{padding:34px 16px;text-align:center;color:var(--dim);font-size:14px}

/* month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px;
  font-family:"JetBrains Mono",monospace}
.day{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;min-height:62px;
  padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.day.out{opacity:.32}
.day.sel{border-color:var(--text)}
.day.now{border-color:var(--today)}
.dnum{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
.day.now .dnum{color:var(--today)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:99px}
.dot.a{background:var(--anniv)}.dot.b{background:var(--birth)}
.dcount{font-size:10.5px;color:var(--dim);font-family:"JetBrains Mono",monospace;margin-top:auto}

/* detail */
.detail{margin-top:22px;scroll-margin-top:12px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{font-size:16px}
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);margin-bottom:8px}
.grp>summary{padding:11px 14px;cursor:pointer;list-style:none;display:flex;
  align-items:center;gap:9px;flex-wrap:wrap;font-family:"Space Grotesk",sans-serif;
  font-weight:700;font-size:14.5px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"\25B8";color:var(--dim);font-weight:400;transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;color:var(--ink);
  font-family:"JetBrains Mono",monospace}
.tag.a{background:var(--anniv)}.tag.b{background:var(--birth)}
.nsongs{margin-left:auto;color:var(--dim);font-weight:400;font-size:12px;
  font-family:"JetBrains Mono",monospace}
.gbody{padding:0 14px 12px}
ul{margin:0;padding:0;list-style:none}
li{font-size:13px;padding:5px 0;border-top:1px solid var(--line);display:flex;gap:10px;
  justify-content:space-between;align-items:baseline}
li .d{color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:11.5px;white-space:nowrap}

/* birthday card */
.bday{position:relative;overflow:hidden;border-radius:var(--r);padding:13px 15px;margin:0 0 10px;
  background:linear-gradient(135deg,rgba(255,107,170,.20),rgba(232,184,75,.14));
  border:1px solid rgba(255,107,170,.42)}
.bday .who{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:8px}
.bday .meta{font-size:12.5px;color:#F3D9E6;margin-top:3px;font-family:"JetBrains Mono",monospace}
.bday .turns{display:inline-block;margin-top:8px;background:var(--birth);color:var(--ink);
  font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px}
.conf{position:absolute;top:-8px;width:6px;height:10px;border-radius:1px;opacity:.85;
  animation:fall 2.6s linear infinite}
@keyframes fall{to{transform:translateY(150px) rotate(320deg)}}
@media(prefers-reduced-motion:reduce){.conf{animation:none;opacity:.5}}

/* year grid */
.ygrid{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;
  border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:12px}
.ylab{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);text-align:right}
.ydays{display:grid;grid-template-columns:repeat(31,1fr);gap:2px}
.ynum{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--dim);text-align:center}
.ycell{padding:0;border:none;border-radius:2px;background:var(--ink-3);
  aspect-ratio:1;min-height:9px;cursor:pointer}
.ycell.off{background:transparent;cursor:default}
.ycell.a{background:var(--anniv)} .ycell.b{background:var(--birth)}
.ycell.both{background:linear-gradient(135deg,var(--anniv) 50%,var(--birth) 50%)}
.ycell.now{outline:1.5px solid var(--today);outline-offset:1px}
.ycell.sel{outline:1.5px solid var(--text);outline-offset:1px}

/* explore */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
  font-family:"JetBrains Mono",monospace;font-weight:400}
td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace}
td.rk{color:var(--dim);font-family:"JetBrains Mono",monospace;width:34px}
.flag{font-size:10px;font-family:"JetBrains Mono",monospace;padding:1px 5px;
  border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:4px}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:14px}
td .sub{display:none}
@media(max-width:640px){
  td .sub{display:block;color:var(--dim)}
  .lane-head,.lane{grid-template-columns:minmax(74px,1fr) repeat(7,1fr)}
  .lname{font-size:11.5px;padding:7px 7px}
  h1{font-size:20px}
  .hide-sm{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bonus calendar</h1>
    <span class="sub">SuperStar SMTOWN &middot; <span id="stat">Loading…</span></span>
    <button id="reload" style="padding:5px 10px;font-size:12.5px">Refresh</button>
  </header>

  <div class="modes">
    <button id="mCal" class="on">Calendar</button>
    <button id="mExp">Explore songs</button>
  </div>

  <div id="calWrap">
    <div class="legend">
      <span class="key"><i class="swatch sw-a"></i> 3% release anniversary</span>
      <span class="key"><i class="swatch sw-b"></i> 2% member birthday</span>
      <span class="key">Both run 7 days: 3 before, the day itself, 3 after.</span>
    </div>
  </div>

  <details class="filter" id="filter">
    <summary>Groups <span class="count" id="fcount"></span></summary>
    <div class="fbody">
      <input id="search" type="search" placeholder="Find a group or soloist" autocomplete="off">
      <div class="bar" style="margin:0 0 10px">
        <button id="selAll">Select all</button>
        <button id="selNone">Clear</button>
        <button id="selActive">Only ones with bonuses now</button>
      </div>
      <p class="sub" style="margin:0 0 8px">Tap the star to favourite, the name to show or hide.</p>
      <div class="chips" id="chips"></div>
    </div>
  </details>

  <div id="calBody">
    <div class="bar">
      <button id="favBtn">★ Favourites</button>
      <button id="tabWeek" class="on">Next 7 days</button>
      <button id="tabMonth">Month</button>
      <button id="tabYear">Year</button>
      <span class="spacer"></span>
      <button id="prev" aria-label="Previous">&larr;</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next">&rarr;</button>
    </div>
    <div class="bar"><span class="range mono" id="range"></span></div>
    <div id="week"></div>
    <div id="month" hidden></div>
    <div id="year" hidden></div>
    <div class="detail" id="detail"></div>
  </div>

  <div id="expBody" hidden>
    <div class="panel">
      <div class="bar" style="margin:0 0 12px">
        <span class="sub" style="width:100%;margin:0 0 2px">Quick picks</span>
        <button class="preset" data-p="score">Best score — SP, most Hard notes</button>
        <button class="preset" data-p="grind">Best grind — SP, not Hard, shortest</button>
        <button class="preset" data-p="dense">Most notes per second (Hard)</button>
        <button class="preset" data-p="easyfarm">Easiest — SP, fewest Hard notes</button>
      </div>
      <div class="bar" style="margin-bottom:0;border-top:1px solid var(--line);padding-top:12px">
        <label>Step 1 — rank by
          <select id="col">
            <option value="h">Hard note count</option>
            <option value="n">Normal note count</option>
            <option value="e">Easy note count</option>
            <option value="lenSec">Length</option>
            <option value="nps">Hard notes per second</option>
            <option value="msc">Monthly score challenge</option>
            <option value="year">Release year</option>
          </select>
        </label>
        <select id="dir"><option value="top">Highest</option><option value="bottom">Lowest</option></select>
        <label>keep <input id="topn" type="number" min="1" max="500" value="10" aria-label="How many to keep"></label>
      </div>
      <div class="bar" style="margin:10px 0 0">
        <label>Step 2 — then rank those by
          <select id="col2">
            <option value="">nothing (keep step 1 order)</option>
            <option value="h">Hard note count</option>
            <option value="n">Normal note count</option>
            <option value="e">Easy note count</option>
            <option value="lenSec">Length</option>
            <option value="nps">Hard notes per second</option>
            <option value="msc">Monthly score challenge</option>
            <option value="year">Release year</option>
          </select>
        </label>
        <select id="dir2"><option value="top">Highest</option><option value="bottom">Lowest</option></select>
        <label>show <input id="topn2" type="number" min="1" max="500" value="10" aria-label="How many to show"></label>
        <span class="spacer"></span>
        <select id="fSP"><option value="">SP: any</option><option value="y">SP only</option><option value="n">No SP</option></select>
        <select id="fGr"><option value="">Grind: any</option><option value="y">Grind only</option><option value="n">No grind</option></select>
        <select id="fHd"><option value="">Hard: any</option><option value="y">Hard only</option><option value="n">Not hard</option></select>
      </div>
      <p class="sub" style="margin:12px 0 0">Uses the groups picked above. <span id="expScope"></span></p>
    </div>
    <div id="expOut" style="margin-top:14px"></div>
  </div>
</div>

const truthy = v => /^(true|yes|1)$/i.test(String(v).trim());
const numOf = v => { const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
function lenSec(t){ const m=/^(\d+):(\d{2})$/.exec(String(t||'').trim());
  return m ? +m[1]*60 + +m[2] : null; }

async function loadLive(){
  const grab = async t => { const r = await fetch(gviz(t));
    if(!r.ok) throw new Error(t+' returned '+r.status); return parseCSV(await r.text()); };
  const [ex,me,ro] = await Promise.all([grab('Export'),grab('Members'),grab('Unit Roster')]);
  const songs = ex.slice(1).filter(r=>r[1]).map(r=>({
    artist:(r[0]||'').trim(), song:(r[1]||'').trim(), len:(r[2]||'').trim(),
    e:numOf(r[3]), n:numOf(r[4]), h:numOf(r[5]),
    date:toISO(r[6]), md:(r[7]||'').trim(), msc:numOf(r[8]),
    sp:truthy(r[9]), grind:truthy(r[10]), hard:truthy(r[11])
  })).filter(s=>s.artist && (s.date || /^\d{2}-\d{2}$/.test(s.md)));
  const units={};
  ro.slice(1).forEach(r=>{ const l=(r[0]||'').trim(), w=(r[1]||'').trim();
    if(l&&w)(units[w]=units[w]||[]).push(l); });
  const members = me.slice(1).filter(r=>r[0]&&r[1]).map(r=>({
    name:(r[0]||'').trim(), bd:(r[1]||'').trim(), dob:toISO(r[2]),
    units:units[(r[0]||'').trim()]||[] }));
  if(!songs.length) throw new Error('the Export tab came back empty');
  return { songs, members, generated:new Date().toLocaleString() };
}

/* ---------- state ---------- */
let ARTISTS=[], byArtist={}, MEM_UNITS=[], mdSongs={}, mdMembers={};
let selected=new Set(), favourites=new Set(), everSelected=false;
let view='week', mode='cal', anchor=midnight(new Date()), picked=null;

function readHash(){
  const m=/fav=([^&]*)/.exec(location.hash);
  if(m) favourites=new Set(decodeURIComponent(m[1]).split('|').filter(Boolean));
}
function writeHash(){
  location.replace('#fav='+encodeURIComponent([...favourites].join('|')));
}

function rebuildIndexes(){
  ARTISTS=[...new Set(SONGS.map(s=>s.artist))].sort((a,b)=>a.localeCompare(b));
  byArtist={}; SONGS.forEach(s=>(byArtist[s.artist]=byArtist[s.artist]||[]).push(s));
  MEM_UNITS=MEMBERS.map(m=>({ name:m.name, dob:m.dob,
    mm:+String(m.bd).slice(0,2), dd:+String(m.bd).slice(3,5),
    units:(m.units||[]).filter(u=>byArtist[u]) })).filter(m=>m.mm&&m.dd);
  mdSongs={}; mdMembers={};
  SONGS.forEach(s=>{ const [m,d]=mdOf(s); if(!m||!d) return;
    const k=PAD(m)+'-'+PAD(d); (mdSongs[k]=mdSongs[k]||[]).push(s); });
  MEM_UNITS.forEach(m=>{ const k=PAD(m.mm)+'-'+PAD(m.dd);
    (mdMembers[k]=mdMembers[k]||[]).push(m); });
  if(!everSelected){ selected=new Set(ARTISTS); everSelected=true; }
  else selected=new Set([...selected].filter(a=>byArtist[a]));
}
/* the 7 month-days whose anniversary window covers this date. Built from real
   dates, so a 02-28 window reaches 03-02 in a leap year and 03-03 otherwise. */
function windowKeys(day){
  const out=[];
  for(let o=-3;o<=3;o++){ const d=new Date(day.getTime()+o*DAY);
    out.push(PAD(d.getMonth()+1)+'-'+PAD(d.getDate())); }
  return out;
}

/* a window is the date +/- 3 days, checked against neighbouring years so
   windows straddling 31 December still resolve. */
function inWindow(day, mm, dd){
  for(const y of [day.getFullYear()-1, day.getFullYear(), day.getFullYear()+1]){
    const t=new Date(y,mm-1,dd); if(Math.abs((day-t)/DAY)<=3) return true;
  }
  return false;
}
function mdOf(s){
  if(s.date){ const p=s.date.split('-'); return [+p[1],+p[2]]; }
  const p=(s.md||'').split('-'); return [+p[0],+p[1]];
}
function bonusesOn(day){
  const out={};
  for(const k of windowKeys(day)){
    for(const s of (mdSongs[k]||[])){
      if(!selected.has(s.artist)) continue;
      (out[s.artist]=out[s.artist]||{anniv:[],birth:[]}).anniv.push(s);
    }
    for(const m of (mdMembers[k]||[])){
      for(const u of m.units){ if(!selected.has(u)) continue;
        const t=(out[u]=out[u]||{anniv:[],birth:[]});
        if(!t.birth.includes(m)) t.birth.push(m); }
    }
  }
  return out;
}

/* ---------- week ---------- */
function renderWeek(){
  const days=Array.from({length:7},(_,i)=>new Date(anchor.getTime()+i*DAY));
  const map=days.map(bonusesOn);
  const names=[...new Set(map.flatMap(o=>Object.keys(o)))]
    .sort((a,b)=>(favourites.has(b)-favourites.has(a))||a.localeCompare(b));
  const t=iso(midnight(new Date()));
  let h='<div class="lanes"><div class="lane-head"><div class="dh"></div>'+
    days.map((d,i)=>'<div class="dh'+(iso(d)===t?' today':'')+'"><button data-i="'+i+
      '">'+d.toLocaleDateString(undefined,{weekday:'short'})+'<b>'+d.getDate()+
      '</b></button></div>').join('')+'</div>';
  if(!names.length){
    h+='<div class="empty">No bonuses in this stretch for the groups you picked.</div></div>';
  } else {
    for(const a of names){
      const A=map.map(o=>!!(o[a]&&o[a].anniv.length)), B=map.map(o=>!!(o[a]&&o[a].birth.length));
      const dual=A.some(Boolean)&&B.some(Boolean);
      h+='<div class="lane'+(dual?' dual':'')+'"><div class="lname">'+
        (favourites.has(a)?'<span class="fs">★</span>':'')+esc(a)+'</div>';
      for(let i=0;i<7;i++){
        h+='<div class="cell'+(iso(days[i])===t?' today':'')+'">';
        for(const [arr,cls] of [[A,'a'],[B,'b']])
          if(arr[i]) h+='<div class="hold '+cls+(arr[i-1]?'':' start')+(arr[i+1]?'':' end')+'"></div>';
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  document.getElementById('week').innerHTML=h;
  document.querySelectorAll('.dh button').forEach(b=>b.onclick=()=>{
    const d=days[+b.dataset.i]; picked=iso(d); renderDetail([d],[bonusesOn(d)]); jump();
  });
  renderDetail(days,map);
}

/* ---------- month ---------- */
function renderMonth(){
  const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
  const start=new Date(first.getTime()-first.getDay()*DAY), t=iso(midnight(new Date()));
  let h='<div class="month">'+['S','M','T','W','T','F','S']
    .map(d=>'<div class="mh">'+d+'</div>').join('');
  for(let i=0;i<42;i++){
    const d=new Date(start.getTime()+i*DAY), o=bonusesOn(d), names=Object.keys(o);
    const anyA=names.some(n=>o[n].anniv.length), anyB=names.some(n=>o[n].birth.length);
    h+='<button class="day'+(d.getMonth()!==first.getMonth()?' out':'')+
      (iso(d)===t?' now':'')+(picked&&iso(d)===picked?' sel':'')+'" data-d="'+iso(d)+
      '"><span class="dnum">'+d.getDate()+'</span><span class="dots">'+
      (anyA?'<i class="dot a"></i>':'')+(anyB?'<i class="dot b"></i>':'')+'</span>'+
      (names.length?'<span class="dcount">'+names.length+'</span>':'')+'</button>';
  }
  document.getElementById('month').innerHTML=h+'</div>';
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{
    picked=b.dataset.d; renderMonth();
    const d=new Date(picked+'T00:00:00');
    renderDetail([d],[bonusesOn(d)]); jump();
  });
  if(picked){ const d=new Date(picked+'T00:00:00'); renderDetail([d],[bonusesOn(d)]); }
  else document.getElementById('detail').innerHTML='';
}
function renderYear(){
  const Y=anchor.getFullYear(), t=iso(midnight(new Date()));
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h='<div class="ygrid">';
  h+='<div class="ylab"></div><div class="ydays">'+
     Array.from({length:31},(_,i)=>'<span class="ynum">'+((i+1)%5===0||i===0?(i+1):'')+'</span>').join('')+'</div>';
  let totA=0,totB=0;
  for(let mo=0;mo<12;mo++){
    const dim=new Date(Y,mo+1,0).getDate();
    let cells='',cA=0,cB=0;
    for(let d=1;d<=31;d++){
      if(d>dim){ cells+='<span class="ycell off"></span>'; continue; }
      const day=new Date(Y,mo,d), o=bonusesOn(day), names=Object.keys(o);
      const a=names.some(n=>o[n].anniv.length), b=names.some(n=>o[n].birth.length);
      if(a)cA++; if(b)cB++;
      const cls=a&&b?'both':a?'a':b?'b':'';
      cells+='<button class="ycell '+cls+(iso(day)===t?' now':'')+
        (picked===iso(day)?' sel':'')+'" data-d="'+iso(day)+'" title="'+
        day.toLocaleDateString(undefined,{month:'short',day:'numeric'})+
        (names.length?' — '+names.length+' with a bonus':'')+'"></button>';
    }
    totA+=cA; totB+=cB;
    h+='<div class="ylab">'+M[mo]+'</div><div class="ydays">'+cells+'</div>';
  }
  h+='</div><p class="sub" style="margin:10px 0 0">'+Y+': '+totA+
     ' days with a 3% window, '+totB+' with a 2% window, for the groups you picked.</p>';
  document.getElementById('year').innerHTML=h;
  document.querySelectorAll('.ycell[data-d]').forEach(b=>b.onclick=()=>{
    picked=b.dataset.d; renderYear();
    const d=new Date(picked+'T00:00:00'); renderDetail([d],[bonusesOn(d)]); jump(); });
  if(picked && picked.slice(0,4)===String(Y)){
    const d=new Date(picked+'T00:00:00'); renderDetail([d],[bonusesOn(d)]);
  } else document.getElementById('detail').innerHTML='';
}
function jump(){
  const el=document.getElementById('detail');
  el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches
    ?'auto':'smooth', block:'start'});
}

/* ---------- detail ---------- */
const CONF=['#FF6BAA','#E8B84B','#7BE0D6','#C9A7FF','#FFFFFF'];
function confetti(){
  let s='';
  for(let i=0;i<14;i++) s+='<i class="conf" style="left:'+(4+i*7)+'%;background:'+
    CONF[i%CONF.length]+';animation-delay:'+(i*0.19).toFixed(2)+'s"></i>';
  return s;
}
function ageOn(dob, day){
  if(!dob) return null;
  const b=new Date(dob+'T00:00:00');
  let y=day.getFullYear();
  const thisYear=new Date(y,b.getMonth(),b.getDate());
  if((day-thisYear)/DAY < -3) y-=0;
  return y - b.getFullYear();
}
function prettyDOB(dob){
  if(!dob) return null;
  const b=new Date(dob+'T00:00:00');
  return b.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
}
function renderDetail(days, map){
  const agg={};
  days.forEach((d,i)=>{ for(const [a,v] of Object.entries(map[i])){
    const t=agg[a]=agg[a]||{anniv:new Map(),birth:new Map()};
    v.anniv.forEach(s=>t.anniv.set(s.song,s));
    v.birth.forEach(m=>t.birth.set(m.name,m));
  }});
  const names=Object.keys(agg)
    .sort((a,b)=>(favourites.has(b)-favourites.has(a))||a.localeCompare(b));
  const focus=days.length===1?days[0]:null;
  const label=focus
    ? focus.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})
    : 'Across these 7 days';
  const el=document.getElementById('detail');
  if(!names.length){ el.innerHTML='<div class="dhead"><h2>'+label+'</h2></div>'+
    '<div class="empty">Nothing boosted.</div>'; return; }

  let h='<div class="dhead"><h2>'+label+'</h2><span class="sub">'+names.length+
    ' with a bonus</span>'+(focus?'<span class="spacer"></span>'+
    '<button id="backWeek" style="padding:5px 10px;font-size:12.5px">Back to the week</button>':'')+'</div>';

  const cel=[];
  for(const a of names) for(const m of agg[a].birth.values())
    if(!cel.some(x=>x.name===m.name)) cel.push(m);
  for(const m of cel){
    const day=focus||days[0], age=ageOn(m.dob,day), d=prettyDOB(m.dob);
    h+='<div class="bday">'+confetti()+'<div class="who">🎂 '+esc(m.name)+'</div>'+
      (d?'<div class="meta">'+esc(d)+'</div>':'')+
      (age?'<span class="turns">turns '+age+'</span>':'')+
      '<div class="meta" style="margin-top:8px">2% on every song by '+
      m.units.filter(u=>selected.has(u)).map(esc).join(', ')+'</div></div>';
  }

  for(const a of names){
    const t=agg[a], total=(byArtist[a]||[]).length;
    h+='<details class="grp"><summary>'+(favourites.has(a)?'<span class="fs" style="color:var(--fav)">★</span>':'')+
      esc(a);
    if(t.anniv.size) h+='<span class="tag a">3%</span>';
    if(t.birth.size) h+='<span class="tag b">2%</span>';
    h+='<span class="nsongs">'+(t.birth.size?total+' songs':t.anniv.size+' of '+total)+
      '</span></summary><div class="gbody">';
    if(t.birth.size) h+='<p class="sub" style="margin:0 0 8px">Birthday: '+
      [...t.birth.values()].map(m=>esc(m.name)).join(', ')+' — every song counts.</p>';
    const list=t.birth.size?(byArtist[a]||[]):[...t.anniv.values()];
    h+='<ul>'+list.slice().sort((x,y)=>x.song.localeCompare(y.song)).map(s=>{
      const dd=s.date?s.date.slice(5).replace('-','/')+'/'+s.date.slice(0,4):(s.md||'');
      return '<li><span>'+esc(s.song)+(t.anniv.has(s.song)&&t.birth.size?
        '<span class="flag">3%</span>':'')+'</span><span class="d">'+esc(dd)+'</span></li>';
    }).join('')+'</ul></div></details>';
  }
  el.innerHTML=h;
  const back=document.getElementById('backWeek');
  if(back) back.onclick=()=>{ picked=null; draw();
    document.getElementById('calBody').scrollIntoView({block:'start'}); };
}

/* ---------- explore ---------- */
const COLS={lenSec:{label:'Length',fmt:v=>Math.floor(v/60)+':'+PAD(v%60)},
  e:{label:'Easy notes'}, n:{label:'Normal notes'}, h:{label:'Hard notes'},
  nps:{label:'Notes / sec',fmt:v=>v.toFixed(2)},
  msc:{label:'Monthly score',fmt:v=>v.toLocaleString()},
  year:{label:'Release year',fmt:v=>String(v)}};
function valueOf(s,k){
  if(k==='lenSec') return lenSec(s.len);
  if(k==='year') return s.date?+s.date.slice(0,4):null;
  if(k==='nps'){ const L=lenSec(s.len), H=typeof s.h==='number'?s.h:numOf(s.h);
    return (L&&H)?H/L:null; }
  const v=s[k]; return typeof v==='number'?v:numOf(v);
}
const PRESETS={
  score:{col:'h',dir:'top',sp:'y',gr:'',hd:''},
  grind:{col:'lenSec',dir:'bottom',sp:'y',gr:'',hd:'n',col2:'h'},
  dense:{col:'nps',dir:'top',sp:'',gr:'',hd:''},
  easyfarm:{col:'h',dir:'bottom',sp:'y',gr:'',hd:''}
};
function renderExplore(){
  const k=document.getElementById('col').value, dir=document.getElementById('dir').value;
  const n=Math.max(1,Math.min(200,+document.getElementById('topn').value||5));
  const f={sp:document.getElementById('fSP').value, grind:document.getElementById('fGr').value,
           hard:document.getElementById('fHd').value};
  let rows=SONGS.filter(s=>selected.has(s.artist));
  const pool=rows;
  for(const key of ['sp','grind','hard']){
    if(f[key]==='y') rows=rows.filter(s=>s[key]);
    if(f[key]==='n') rows=rows.filter(s=>!s[key]);
  }
  rows=rows.map(s=>({s,v:valueOf(s,k)})).filter(r=>r.v!==null&&r.v!==undefined&&!isNaN(r.v));
  rows.sort((a,b)=>dir==='top'?b.v-a.v:a.v-b.v);
  let out=rows.slice(0,n), C=COLS[k];
  const k2=document.getElementById('col2').value;
  if(k2){
    const dir2=document.getElementById('dir2').value;
    const n2=Math.max(1,Math.min(500,+document.getElementById('topn2').value||10));
    out=out.map(r=>({s:r.s,v:valueOf(r.s,k2)}))
           .filter(r=>r.v!==null&&r.v!==undefined&&!isNaN(r.v));
    out.sort((a,b)=>dir2==='top'?b.v-a.v:a.v-b.v);
    out=out.slice(0,n2); C=COLS[k2];
  }
  const dropped=pool.length-rows.length;
  document.getElementById('expScope').textContent =
    selected.size+' of '+ARTISTS.length+' groups · '+rows.length+' songs match'+
    (dropped?' · '+dropped+' skipped, no '+C.label.toLowerCase()+' recorded yet':'');
  if(!out.length){ document.getElementById('expOut').innerHTML=
    '<div class="empty">Nothing matches those filters.</div>'; return; }
  const shown=k2||k;
  const hi=c=>(c===shown||c===k)?' style="color:var(--anniv);font-weight:700"':'';
  document.getElementById('expOut').innerHTML='<div class="panel" style="padding:0">'+
    '<table><thead><tr><th></th><th>Song</th><th class="hide-sm">Artist</th>'+
    '<th class="num"'+hi('lenSec')+'>Len</th><th class="num hide-sm"'+hi('e')+'>Easy</th>'+
    '<th class="num hide-sm"'+hi('n')+'>Norm</th><th class="num"'+hi('h')+'>Hard</th>'+
    (['nps','msc','year'].includes(shown)?'<th class="num" style="color:var(--anniv);font-weight:700">'+
      C.label+'</th>':'')+'</tr></thead><tbody>'+
    out.map((r,i)=>{const s=r.s, L=lenSec(s.len);
      return '<tr><td class="rk">'+(i+1)+'</td><td>'+esc(s.song)+
      (s.sp?'<span class="flag">SP</span>':'')+(s.grind?'<span class="flag">grind</span>':'')+
      (s.hard?'<span class="flag">hard</span>':'')+
      '<div class="sub" style="font-size:11px">'+esc(s.artist)+'</div></td>'+
      '<td class="hide-sm sub">'+esc(s.artist)+'</td>'+
      '<td class="num"'+hi('lenSec')+'>'+(L?COLS.lenSec.fmt(L):'—')+'</td>'+
      '<td class="num hide-sm"'+hi('e')+'>'+(s.e??'—')+'</td>'+
      '<td class="num hide-sm"'+hi('n')+'>'+(s.n??'—')+'</td>'+
      '<td class="num"'+hi('h')+'>'+(s.h??'—')+'</td>'+
      (['nps','msc','year'].includes(shown)?'<td class="num" style="color:var(--anniv);font-weight:700">'+
        (C.fmt?C.fmt(r.v):r.v)+'</td>':'')+'</tr>';}).join('')+
    '</tbody></table></div>';
}

/* ---------- chrome ---------- */
function renderChips(q=''){
  const t=q.trim().toLowerCase();

    .sort((a,b)=>(favourites.has(b)-favourites.has(a))||a.localeCompare(b));

function setRange(){
  const r=document.getElementById('range');

    r.textContent=anchor.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+

  else if(view==='month') r.textContent=anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'});

function draw(){

  document.getElementById('month').hidden=view!=='month';

function setMode(m){

document.getElementById('mCal').onclick=()=>setMode('cal');
document.getElementById('mExp').onclick=()=>setMode('exp');
document.getElementById('tabWeek').onclick=()=>{ picked=null; setView('week','tabWeek'); };
function setView(v,btn){ view=v;

document.getElementById('tabMonth').onclick=()=>setView('month','tabMonth');
document.getElementById('tabYear').onclick=()=>setView('year','tabYear');
const step=n=>{ anchor = view==='week' ? new Date(anchor.getTime()+n*7*DAY)

  : new Date(anchor.getFullYear()+n,0,1); draw(); };

document.getElementById('today').onclick=()=>{ anchor=midnight(new Date());
  picked=iso(anchor); draw(); };
document.getElementById('favBtn').onclick=()=>{
  if(!favourites.size){ document.getElementById('filter').open=true;
    document.getElementById('fcount').textContent='star a group first'; return; }
  const same=selected.size===favourites.size&&[...favourites].every(a=>selected.has(a));
  selected=same?new Set(ARTISTS):new Set([...favourites].filter(a=>byArtist[a]));
  renderChips(document.getElementById('search').value); draw();
};
document.getElementById('search').oninput=e=>renderChips(e.target.value);
document.getElementById('selAll').onclick=()=>{ selected=new Set(ARTISTS);
  renderChips(document.getElementById('search').value); draw(); };
document.getElementById('selNone').onclick=()=>{ selected=new Set();
  renderChips(document.getElementById('search').value); draw(); };
document.getElementById('selActive').onclick=()=>{
  const all=new Set(ARTISTS), keep=new Set();
  for(let i=0;i<7;i++){ const d=new Date(anchor.getTime()+i*DAY);
    selected=all; Object.keys(bonusesOn(d)).forEach(a=>keep.add(a)); }
  selected=keep.size?keep:all;
  renderChips(document.getElementById('search').value); draw(); };
['col','dir','topn','col2','dir2','topn2','fSP','fGr','fHd'].forEach(id=>
  document.getElementById(id).addEventListener('input',renderExplore));
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
  const p=PRESETS[b.dataset.p];
  document.getElementById('col2').value=p.col2||'';
  document.getElementById('col').value=p.col;
  document.getElementById('dir').value=p.dir;
  document.getElementById('fSP').value=p.sp;
  document.getElementById('fGr').value=p.gr;
  document.getElementById('fHd').value=p.hd;
  document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('on',x===b));
  renderExplore(); });
document.getElementById('reload').onclick=()=>boot();

function applyData(d,note){
  DATA=d; SONGS=d.songs; MEMBERS=d.members; rebuildIndexes();
  document.getElementById('stat').textContent=SONGS.length.toLocaleString()+' songs · '+
    ARTISTS.length+' artists · '+MEMBERS.length+' members · '+note;
  renderChips(document.getElementById('search').value||''); draw();
}
async function boot(){
  const stat=document.getElementById('stat');
  if(!SHEET_ID){ applyData(FALLBACK,'built-in copy from '+FALLBACK.generated); return; }
  stat.textContent='Reading the sheet…';
  try { applyData(await loadLive(),'live from your sheet · '+new Date().toLocaleTimeString()); }
  catch(err){ applyData(FALLBACK,'built-in copy — could not reach the sheet ('+err.message+')'); }
}
readHash(); rebuildIndexes(); renderChips(); draw(); boot();
</script>
</body>
</html>
